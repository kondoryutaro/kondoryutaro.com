<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Bus Stop Data Collector</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 6px;
    background: #f4f4f4;
    font-size: 13px;
}

h1 {
    text-align: center;
    font-size: 17px;
    margin: 5px 0 8px 0;
}

h2 {
    font-size: 14px;
    margin: 3px 0 6px 0;
}

h3 {
    font-size: 13px;
    margin: 4px 0;
}

p {
    font-size: 11px;
    margin: 3px 0;
}

.section {
    background: white;
    padding: 7px;
    margin-bottom: 6px;
    border-radius: 6px;
}

.counter {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    margin: 3px;
}

.button-row {
    display: flex;
    gap: 4px;
    justify-content: center;
}

button {
    font-size: 14px;
    padding: 8px 10px;
    min-width: 50px;
    border: none;
    border-radius: 5px;
    background: #ddd;
}

button:active {
    background: #bbb;
}

.bus-button {
    flex: 1;
    min-width: 0;
}

.depart-button {
    width: 100%;
    margin-top: 6px;
    padding: 9px;
    font-weight: bold;
}

.active-bus {
    border: 1px solid #ccc;
    padding: 6px;
    margin-top: 5px;
    border-radius: 5px;
}

.export-button {
    width: 49%;
    padding: 8px;
    font-size: 12px;
    margin-top: 3px;
}


.waiting-status {
    text-align: center;
    font-size: 12px;
    margin: 4px 0 6px 0;
    font-weight: bold;
}

.waiting-recorded {
    text-align: center;
    font-size: 11px;
    margin-top: 5px;
}

.timer-button {
    width: 100%;
    margin-top: 6px;
    padding: 8px;
    font-weight: bold;
}

</style>

</head>


<body>

<h1>Bus Stop Data Collection</h1>


<div class="section">

<h2>Passenger Arrivals</h2>

<div id="passengerTotal" class="counter">0</div>

<div class="button-row">

<button onclick="changePassenger(-1)">-1</button>

<button onclick="recordPassenger(1)">+1</button>

<button onclick="recordPassenger(2)">+2</button>

<button onclick="recordPassenger(3)">+3</button>

</div>

</div>


<div class="section">

<h2>Bus Arrival</h2>

<div class="button-row">

<button class="bus-button"
onclick="busArrives('46')">
Bus 46
</button>

<button class="bus-button"
onclick="busArrives('293')">
Bus 293
</button>

<button class="bus-button"
onclick="busArrives('298')">
Bus 298
</button>

</div>

</div>


<div class="section">

<h2>Active Bus</h2>

<div id="activeBuses">

No bus currently at stop.

</div>

</div>



<div class="section">

<h2>Waiting Passenger Count</h2>

<p>Count everyone currently waiting at the bus stop, then press Record Count.</p>

<div id="waitingCount" class="counter">0</div>

<div class="button-row">

<button onclick="changeWaitingCount(-5)">-5</button>

<button onclick="changeWaitingCount(-1)">-1</button>

<button onclick="changeWaitingCount(1)">+1</button>

<button onclick="changeWaitingCount(5)">+5</button>

</div>

<button class="depart-button"
onclick="recordWaitingCount()">
Record Count
</button>

<div id="waitingTimer" class="waiting-status">
5-minute reminder not started.
</div>

<button class="timer-button"
onclick="startWaitingTimer()">
Start / Restart 5-Min Reminder
</button>

<div id="lastWaitingRecord" class="waiting-recorded">
No waiting count recorded yet.
</div>

</div>

<div class="section">

<button class="export-button"
onclick="exportPassengerCSV()">

Export Passenger CSV

</button>

<button class="export-button"
onclick="exportBusCSV()">

Export Bus CSV

</button>


<button class="export-button"
onclick="exportWaitingCSV()">

Export Waiting Count CSV

</button>

<button class="export-button"
onclick="resetSession()">

    Reset / New Session

</button>
    
</div>


<script>

let passengerData = [];

let busData = [];

let passengerTotal = 0;

let activeBuses = {};

let waitingData = [];

let waitingCount = 0;

let waitingTimerDue = null;

let waitingReminderShownFor = null;



function nowString() {

    let d = new Date();

    return d.getFullYear() + "-" +

    String(d.getMonth() + 1).padStart(2, "0") + "-" +

    String(d.getDate()).padStart(2, "0") + " " +

    String(d.getHours()).padStart(2, "0") + ":" +

    String(d.getMinutes()).padStart(2, "0") + ":" +

    String(d.getSeconds()).padStart(2, "0") + "." +

    String(d.getMilliseconds()).padStart(3, "0");

}



function recordPassenger(number) {

    let time = nowString();
    let currentTime = new Date(time.replace(" ", "T"));

    for (let i = 0; i < number; i++) {

        let interarrival = "";

        if (passengerData.length > 0) {

            let previousTime =
                new Date(
                    passengerData[
                        passengerData.length - 1
                    ].time.replace(" ", "T")
                );

            interarrival =
                ((currentTime - previousTime) / 1000)
                .toFixed(3);
        }

        passengerData.push({
            time: time,
            interarrival: interarrival
        });

    }

    passengerTotal += number;

    updatePassengerDisplay();

    saveLocal();
}



function changePassenger(amount) {

    if (amount === -1 && passengerTotal > 0) {

        passengerData.pop();

        passengerTotal--;

        updatePassengerDisplay();

        saveLocal();

    }

}



function updatePassengerDisplay() {

    document.getElementById(
        "passengerTotal"
    ).innerText = passengerTotal;

}



function busArrives(service) {

    if (activeBuses[service]) {

        alert(
            "Bus " + service +
            " is already recorded."
        );

        return;

    }

    activeBuses[service] = {

        arrival: nowString(),

        boarded: 0,

        alighted: 0

    };

    updateActiveBuses();

    saveLocal();

}



function changeBusCount(
    service,
    category,
    amount
) {

    let bus = activeBuses[service];

    if (!bus) return;

    bus[category] += amount;

    if (bus[category] < 0) {

        bus[category] = 0;

    }

    updateActiveBuses();

    saveLocal();

}



function busDeparts(service) {

    let bus = activeBuses[service];

    if (!bus) return;

    let departure = nowString();

    let arrivalDate =
        new Date(bus.arrival.replace(" ", "T"));

    let departureDate =
        new Date(departure.replace(" ", "T"));

    let dwellSeconds =
        (departureDate - arrivalDate) / 1000;

    busData.push({

        service: service,

        arrival: bus.arrival,

        departure: departure,

        dwell: dwellSeconds,

        boarded: bus.boarded,

        alighted: bus.alighted

    });

    delete activeBuses[service];

    updateActiveBuses();

    saveLocal();

}



function updateActiveBuses() {

    let area =
        document.getElementById(
            "activeBuses"
        );

    area.innerHTML = "";

    let services =
        Object.keys(activeBuses);

    if (services.length === 0) {

        area.innerHTML =
        "No bus currently at stop.";

        return;

    }

    services.forEach(function(service) {

        let bus =
            activeBuses[service];

        let box =
            document.createElement("div");

        box.className =
            "active-bus";

        box.innerHTML = `

        <h3>
        Bus ${service}
        </h3>

        <p>
        Arrived:
        ${bus.arrival}
        </p>

        <h3>
        Boarded:
        ${bus.boarded}
        </h3>

        <div class="button-row">

        <button
        onclick="changeBusCount(
        '${service}',
        'boarded',
        -1)">
        -1
        </button>

        <button
        onclick="changeBusCount(
        '${service}',
        'boarded',
        1)">
        +1
        </button>

        <button
        onclick="changeBusCount(
        '${service}',
        'boarded',
        2)">
        +2
        </button>

        <button
        onclick="changeBusCount(
        '${service}',
        'boarded',
        3)">
        +3
        </button>

        </div>

        <h3>
        Alighted:
        ${bus.alighted}
        </h3>

        <div class="button-row">

        <button
        onclick="changeBusCount(
        '${service}',
        'alighted',
        -1)">
        -1
        </button>

        <button
        onclick="changeBusCount(
        '${service}',
        'alighted',
        1)">
        +1
        </button>

        <button
        onclick="changeBusCount(
        '${service}',
        'alighted',
        2)">
        +2
        </button>

        <button
        onclick="changeBusCount(
        '${service}',
        'alighted',
        3)">
        +3
        </button>

        </div>

        <button
        class="depart-button"
        onclick="busDeparts(
        '${service}'
        )">

        Bus ${service} Departed

        </button>

        `;

        area.appendChild(box);

    });

}




function updateWaitingDisplay() {

    document.getElementById(
        "waitingCount"
    ).innerText = waitingCount;

    let last =
        document.getElementById(
            "lastWaitingRecord"
        );

    if (waitingData.length === 0) {

        last.innerText =
            "No waiting count recorded yet.";

    } else {

        let latest =
            waitingData[
                waitingData.length - 1
            ];

        last.innerText =
            "Last recorded: " +
            latest.count +
            " at " +
            latest.time;
    }

}


function changeWaitingCount(amount) {

    waitingCount += amount;

    if (waitingCount < 0) {

        waitingCount = 0;
    }

    updateWaitingDisplay();

    saveLocal();

}


function recordWaitingCount() {

    waitingData.push({

        time: nowString(),

        count: waitingCount

    });

    updateWaitingDisplay();

    saveLocal();

}


function startWaitingTimer() {

    waitingTimerDue =
        Date.now() + 5 * 60 * 1000;

    waitingReminderShownFor = null;

    saveLocal();

    updateWaitingTimer();

}


function updateWaitingTimer() {

    let area =
        document.getElementById(
            "waitingTimer"
        );

    if (!waitingTimerDue) {

        area.innerText =
            "5-minute reminder not started.";

        return;
    }

    let remaining =
        waitingTimerDue - Date.now();

    if (remaining <= 0) {

        area.innerText =
            "COUNT NOW";

        if (
            waitingReminderShownFor !==
            waitingTimerDue
        ) {

            waitingReminderShownFor =
                waitingTimerDue;

            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200]);
            }

            alert(
                "5-minute reminder: count the people currently waiting at the bus stop."
            );
        }

        while (
            waitingTimerDue <= Date.now()
        ) {

            waitingTimerDue +=
                5 * 60 * 1000;
        }

        waitingReminderShownFor = null;

        saveLocal();

        return;
    }

    let totalSeconds =
        Math.ceil(
            remaining / 1000
        );

    let minutes =
        Math.floor(
            totalSeconds / 60
        );

    let seconds =
        totalSeconds % 60;

    area.innerText =
        "Next count in: " +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

}


setInterval(
    updateWaitingTimer,
    1000
);


function downloadCSV(
    filename,
    content
) {

    let blob =
        new Blob(
            [content],
            {type: "text/csv"}
        );

    let link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        filename;

    link.click();

}



function exportPassengerCSV() {

    let csv =
        "DateTime,InterarrivalTimeSeconds\n";

    passengerData.forEach(
        function(passenger) {

            csv +=
                passenger.time + "," +
                passenger.interarrival + "\n";

        }
    );

    let session =
        sessionID();

    downloadCSV(

        "passenger_arrivals_" +
        session +
        ".csv",

        csv
    );
}



function exportBusCSV() {

    let csv =

    "Service,ArrivalTime," +

    "DepartureTime," +

    "DwellTimeSeconds," +

    "Boarded,Alighted\n";

    busData.forEach(
        function(bus) {

        csv +=

        bus.service + "," +

        bus.arrival + "," +

        bus.departure + "," +

        bus.dwell + "," +

        bus.boarded + "," +

        bus.alighted + "\n";

        }
    );

    let session =
        sessionID();

    downloadCSV(

        "bus_events_" +
        session +
        ".csv",

        csv
    );

}




function exportWaitingCSV() {

    let csv =
        "DateTime,WaitingPassengers\n";

    waitingData.forEach(
        function(record) {

            csv +=
                record.time + "," +
                record.count + "\n";

        }
    );

    let session =
        sessionID();

    downloadCSV(

        "waiting_counts_" +
        session +
        ".csv",

        csv
    );

}


function sessionID() {

    let d = new Date();

    return (

        d.getFullYear() +

        String(
            d.getMonth() + 1
        ).padStart(2, "0") +

        String(
            d.getDate()
        ).padStart(2, "0") +

        "_" +

        String(
            d.getHours()
        ).padStart(2, "0") +

        String(
            d.getMinutes()
        ).padStart(2, "0")

    );

}



function saveLocal() {

    localStorage.setItem(

        "passengerData",

        JSON.stringify(
            passengerData
        )

    );

    localStorage.setItem(

        "busData",

        JSON.stringify(
            busData
        )

    );

    localStorage.setItem(

        "activeBuses",

        JSON.stringify(
            activeBuses
        )

    );

    localStorage.setItem(

        "passengerTotal",

        passengerTotal
    );

    localStorage.setItem(

        "waitingData",

        JSON.stringify(
            waitingData
        )

    );

    localStorage.setItem(

        "waitingCount",

        waitingCount
    );

    localStorage.setItem(

        "waitingTimerDue",

        waitingTimerDue === null
        ? ""
        : waitingTimerDue
    );

}



function loadLocal() {

    let p =
        localStorage.getItem(
            "passengerData"
        );

    let b =
        localStorage.getItem(
            "busData"
        );

    let a =
        localStorage.getItem(
            "activeBuses"
        );

    let t =
        localStorage.getItem(
            "passengerTotal"
        );

    let w =
        localStorage.getItem(
            "waitingData"
        );

    let wc =
        localStorage.getItem(
            "waitingCount"
        );

    let wtd =
        localStorage.getItem(
            "waitingTimerDue"
        );


    if (p) {

        passengerData =
            JSON.parse(p);

    }

    if (b) {

        busData =
            JSON.parse(b);

    }

    if (a) {

        activeBuses =
            JSON.parse(a);

    }

    if (t) {

        passengerTotal =
            Number(t);

    }

    if (w) {

        waitingData =
            JSON.parse(w);

    }

    if (wc) {

        waitingCount =
            Number(wc);

    }

    if (wtd) {

        waitingTimerDue =
            Number(wtd);

    }

    updatePassengerDisplay();

    updateActiveBuses();

    updateWaitingDisplay();

    updateWaitingTimer();

}

function resetSession() {

    let answer = confirm(
        "Clear all current passenger, bus, and waiting-count data?"
    );

    if (!answer) return;

    passengerData = [];
    busData = [];
    activeBuses = {};
    passengerTotal = 0;
    waitingData = [];
    waitingCount = 0;
    waitingTimerDue = null;
    waitingReminderShownFor = null;

    localStorage.removeItem("passengerData");
    localStorage.removeItem("busData");
    localStorage.removeItem("activeBuses");
    localStorage.removeItem("passengerTotal");
    localStorage.removeItem("waitingData");
    localStorage.removeItem("waitingCount");
    localStorage.removeItem("waitingTimerDue");

    updatePassengerDisplay();
    updateActiveBuses();
    updateWaitingDisplay();
    updateWaitingTimer();

    alert("New session started.");
}


loadLocal();

</script>

</body>

</html>
