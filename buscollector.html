<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Bus Stop Data Collector</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 6px;
    background: #f4f4f4;
    font-size: 11px;
}

h1 {
    text-align: center;
    font-size: 15px;
    margin: 5px 0 8px 0;
}

h2 {
    font-size: 12px;
    margin: 3px 0 6px 0;
}

h3 {
    font-size: 11px;
    margin: 4px 0;
}

p {
    font-size: 10px;
    margin: 3px 0;
}

.section {
    background: white;
    padding: 7px;
    margin-bottom: 6px;
    border-radius: 6px;
}

.counter {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin: 3px;
}

.button-row {
    display: flex;
    gap: 4px;
    justify-content: center;
}

button {
    font-size: 12px;
    padding: 7px 8px;
    min-width: 50px;
    border: none;
    border-radius: 5px;
    background: #ddd;
}

button:active {
    background: #bbb;
}

.bus-button {
    flex: 1;
    min-width: 0;
}

.depart-button {
    width: 100%;
    margin-top: 6px;
    padding: 9px;
    font-weight: bold;
}

.active-bus {
    border: 1px solid #ccc;
    padding: 6px;
    margin-top: 5px;
    border-radius: 5px;
}

.export-button {
    width: 49%;
    padding: 8px;
    font-size: 10px;
    margin-top: 3px;
}


.choice-row { display:flex; gap:4px; margin:4px 0 7px 0; }
.choice-button { flex:1; min-width:0; font-size:10px; padding:6px 3px; }
.choice-button.selected { background:#aaa; font-weight:bold; }
</style>

</head>

<body>

<h1>Bus Stop Data Collection</h1>

<div class="section">

<h2>Passenger Arrivals</h2>

<div id="passengerTotal" class="counter">0</div>

<div class="button-row">

<button onclick="changePassenger(-1)">-1</button>

<button onclick="recordPassenger(1)">+1</button>

<button onclick="recordPassenger(2)">+2</button>

<button onclick="recordPassenger(3)">+3</button>

</div>

</div>

<div class="section">

<h2>Bus Arrival</h2>

<div class="button-row">

<button class="bus-button"
onclick="busArrives('46')">
Bus 46
</button>

<button class="bus-button"
onclick="busArrives('293')">
Bus 293
</button>

<button class="bus-button"
onclick="busArrives('298')">
Bus 298
</button>

</div>

</div>

<div class="section">

<h2>Active Bus</h2>

<div id="activeBuses">

No bus currently at stop.

</div>

</div>

<div class="section">

<button class="export-button"
onclick="exportPassengerCSV()">

Export Passenger CSV

</button>

<button class="export-button"
onclick="exportBusCSV()">

Export Bus CSV

</button>

<button class="export-button"
onclick="resetSession()">

Reset / New Session

</button>

</div>

<script>

let passengerData = [];

let busData = [];

let passengerTotal = 0;

let activeBuses = {};



function nowString() {

    let d = new Date();

    return d.getFullYear() + "-" +

    String(d.getMonth() + 1).padStart(2, "0") + "-" +

    String(d.getDate()).padStart(2, "0") + " " +

    String(d.getHours()).padStart(2, "0") + ":" +

    String(d.getMinutes()).padStart(2, "0") + ":" +

    String(d.getSeconds()).padStart(2, "0") + "." +

    String(d.getMilliseconds()).padStart(3, "0");

}



function recordPassenger(number) {

    let time = nowString();
    let currentTime = new Date(time.replace(" ", "T"));

    for (let i = 0; i < number; i++) {

        let interarrival = "";

        if (passengerData.length > 0) {

            let previousTime =
                new Date(
                    passengerData[
                        passengerData.length - 1
                    ].time.replace(" ", "T")
                );

            interarrival =
                ((currentTime - previousTime) / 1000)
                .toFixed(3);
        }

        passengerData.push({
            time: time,
            interarrival: interarrival
        });

    }

    passengerTotal += number;

    updatePassengerDisplay();

    saveLocal();
}



function changePassenger(amount) {

    if (amount === -1 && passengerTotal > 0) {

        passengerData.pop();

        passengerTotal--;

        updatePassengerDisplay();

        saveLocal();

    }

}



function updatePassengerDisplay() {

    document.getElementById(
        "passengerTotal"
    ).innerText = passengerTotal;

}



function busArrives(service) {

    if (activeBuses[service]) {

        alert(
            "Bus " + service +
            " is already recorded."
        );

        return;

    }

    activeBuses[service] = {

        arrival: nowString(),

        boarded: 0,

        alighted: 0,

        busType: "",

        crowdLevel: "",

        failedToBoard: 0

    };

    updateActiveBuses();

    saveLocal();

}



function setBusField(service, field, value) {
    let bus = activeBuses[service];
    if (!bus) return;
    bus[field] = value;
    updateActiveBuses();
    saveLocal();
}


function changeBusCount(
    service,
    category,
    amount
) {

    let bus = activeBuses[service];

    if (!bus) return;

    bus[category] += amount;

    if (bus[category] < 0) {

        bus[category] = 0;

    }

    updateActiveBuses();

    saveLocal();

}



function busDeparts(service) {

    let bus = activeBuses[service];

    if (!bus) return;

    let departure = nowString();

    let arrivalDate =
        new Date(bus.arrival.replace(" ", "T"));

    let departureDate =
        new Date(departure.replace(" ", "T"));

    let dwellSeconds =
        (departureDate - arrivalDate) / 1000;

    busData.push({

        service: service,

        arrival: bus.arrival,

        departure: departure,

        dwell: dwellSeconds,

        busType: bus.busType,

        crowdLevel: bus.crowdLevel,

        boarded: bus.boarded,

        alighted: bus.alighted,

        failedToBoard: bus.failedToBoard

    });

    delete activeBuses[service];

    updateActiveBuses();

    saveLocal();

}



function updateActiveBuses() {

    let area =
        document.getElementById(
            "activeBuses"
        );

    area.innerHTML = "";

    let services =
        Object.keys(activeBuses);

    if (services.length === 0) {

        area.innerHTML =
        "No bus currently at stop.";

        return;

    }

    services.forEach(function(service) {

        let bus =
            activeBuses[service];

        if (bus.busType === undefined) bus.busType = "";
        if (bus.crowdLevel === undefined) bus.crowdLevel = "";
        if (bus.failedToBoard === undefined) bus.failedToBoard = 0;

        let box =
            document.createElement("div");

        box.className =
            "active-bus";

        box.innerHTML = `

        <h3>
        Bus ${service}
        </h3>

        <p>
        Arrived:
        ${bus.arrival}
        </p>


        <h3>Bus Type:</h3>
        <div class="choice-row">
        <button class="choice-button ${bus.busType === 'SD' ? 'selected' : ''}"
        onclick="setBusField('${service}','busType','SD')">Single Deck</button>
        <button class="choice-button ${bus.busType === 'DD' ? 'selected' : ''}"
        onclick="setBusField('${service}','busType','DD')">Double Deck</button>
        </div>

        <h3>Crowd Level:</h3>
        <div class="choice-row">
        <button class="choice-button ${bus.crowdLevel === 'SEA' ? 'selected' : ''}"
        onclick="setBusField('${service}','crowdLevel','SEA')">Seats Available</button>
        <button class="choice-button ${bus.crowdLevel === 'SDA' ? 'selected' : ''}"
        onclick="setBusField('${service}','crowdLevel','SDA')">Standing Available</button>
        <button class="choice-button ${bus.crowdLevel === 'LSD' ? 'selected' : ''}"
        onclick="setBusField('${service}','crowdLevel','LSD')">Limited Standing</button>
        </div>

        <h3>
        Boarded:
        ${bus.boarded}
        </h3>

        <div class="button-row">

        <button
        onclick="changeBusCount(
        '${service}',
        'boarded',
        -1)">
        -1
        </button>

        <button
        onclick="changeBusCount(
        '${service}',
        'boarded',
        1)">
        +1
        </button>

        <button
        onclick="changeBusCount(
        '${service}',
        'boarded',
        2)">
        +2
        </button>

        <button
        onclick="changeBusCount(
        '${service}',
        'boarded',
        3)">
        +3
        </button>

        </div>

        <h3>
        Alighted:
        ${bus.alighted}
        </h3>

        <div class="button-row">

        <button
        onclick="changeBusCount(
        '${service}',
        'alighted',
        -1)">
        -1
        </button>

        <button
        onclick="changeBusCount(
        '${service}',
        'alighted',
        1)">
        +1
        </button>

        <button
        onclick="changeBusCount(
        '${service}',
        'alighted',
        2)">
        +2
        </button>

        <button
        onclick="changeBusCount(
        '${service}',
        'alighted',
        3)">
        +3
        </button>

        </div>


        <h3>
        Failed to Board:
        ${bus.failedToBoard}
        </h3>
        <div class="button-row">
        <button onclick="changeBusCount('${service}','failedToBoard',-1)">-1</button>
        <button onclick="changeBusCount('${service}','failedToBoard',1)">+1</button>
        <button onclick="changeBusCount('${service}','failedToBoard',2)">+2</button>
        <button onclick="changeBusCount('${service}','failedToBoard',3)">+3</button>
        </div>

        <button
        class="depart-button"
        onclick="busDeparts(
        '${service}'
        )">

        Bus ${service} Departed

        </button>

        `;

        area.appendChild(box);

    });

}



function downloadCSV(
    filename,
    content
) {

    let blob =
        new Blob(
            [content],
            {type: "text/csv"}
        );

    let link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        filename;

    link.click();

}



function exportPassengerCSV() {

    let csv =
        "DateTime,InterarrivalTimeSeconds\n";

    passengerData.forEach(
        function(passenger) {

            csv +=
                passenger.time + "," +
                passenger.interarrival + "\n";

        }
    );

    let session =
        sessionID();

    downloadCSV(

        "passenger_arrivals_" +
        session +
        ".csv",

        csv
    );
}



function exportBusCSV() {

    let csv =

    "Service,ArrivalTime," +

    "DepartureTime," +

    "DwellTimeSeconds," +

    "BusType,CrowdLevel," +

    "Boarded,Alighted,FailedToBoard\n";

    busData.forEach(
        function(bus) {

        csv +=

        bus.service + "," +

        bus.arrival + "," +

        bus.departure + "," +

        bus.dwell + "," +

        (bus.busType || "") + "," +

        (bus.crowdLevel || "") + "," +

        bus.boarded + "," +

        bus.alighted + "," +

        (bus.failedToBoard || 0) + "\n";

        }
    );

    let session =
        sessionID();

    downloadCSV(

        "bus_events_" +
        session +
        ".csv",

        csv
    );

}



function sessionID() {

    let d = new Date();

    return (

        d.getFullYear() +

        String(
            d.getMonth() + 1
        ).padStart(2, "0") +

        String(
            d.getDate()
        ).padStart(2, "0") +

        "_" +

        String(
            d.getHours()
        ).padStart(2, "0") +

        String(
            d.getMinutes()
        ).padStart(2, "0")

    );

}



function saveLocal() {

    localStorage.setItem(

        "passengerData",

        JSON.stringify(
            passengerData
        )

    );

    localStorage.setItem(

        "busData",

        JSON.stringify(
            busData
        )

    );

    localStorage.setItem(

        "activeBuses",

        JSON.stringify(
            activeBuses
        )

    );

    localStorage.setItem(

        "passengerTotal",

        passengerTotal
    );

}



function loadLocal() {

    let p =
        localStorage.getItem(
            "passengerData"
        );

    let b =
        localStorage.getItem(
            "busData"
        );

    let a =
        localStorage.getItem(
            "activeBuses"
        );

    let t =
        localStorage.getItem(
            "passengerTotal"
        );


    if (p) {

        passengerData =
            JSON.parse(p);

    }

    if (b) {

        busData =
            JSON.parse(b);

    }

    if (a) {

        activeBuses =
            JSON.parse(a);

    }

    if (t) {

        passengerTotal =
            Number(t);

    }

    updatePassengerDisplay();

    updateActiveBuses();

}

function resetSession() {

    let answer = confirm(
        "Clear all current passenger and bus data?"
    );

    if (!answer) return;

    passengerData = [];
    busData = [];
    activeBuses = {};
    passengerTotal = 0;

    localStorage.removeItem("passengerData");
    localStorage.removeItem("busData");
    localStorage.removeItem("activeBuses");
    localStorage.removeItem("passengerTotal");

    updatePassengerDisplay();
    updateActiveBuses();

    alert("New session started.");
}


loadLocal();

</script>

</body>

</html>
